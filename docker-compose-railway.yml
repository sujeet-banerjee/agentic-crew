# Railway deployment blueprint for the cloud n8n ecosystem.
#
# This is intentionally separate from docker-compose-tunneled.yml and the
# local compose files. Railway creates one service per Compose service.
# Configure persistent volumes and service variables in the Railway UI.
# Keep postgres, redis, qdrant and litellm private; expose n8n only.
#
# Railway does not guarantee Compose depends_on startup ordering. Services
# must retry connections while their dependencies become ready.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      NODE_ENV: production
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Kolkata}
      TZ: ${TZ:-Asia/Kolkata}
      N8N_HOST: my.n8n.ai-maestro.in
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://my.n8n.ai-maestro.in/
      N8N_WEBHOOK_URL: https://my.n8n.ai-maestro.in/
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY on the n8n service}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres.railway.internal
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB on the postgres service}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?Set POSTGRES_USER on the postgres service}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD on the postgres service}
      DB_POSTGRESDB_SCHEMA: public
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB on the postgres service}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER on the postgres service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD on the postgres service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD on the redis service}
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY on the qdrant service}
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY on the litellm service}
      LITELLM_DATABASE_URL: ${LITELLM_DATABASE_URL:?Set LITELLM_DATABASE_URL on the litellm service}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
    volumes:
      - ./config/litellm_config.railway.yaml:/app/config.yaml:ro
    expose:
      - "4000"
    restart: unless-stopped

volumes:
  n8n_data:
  postgres_data:
  redis_data:
  qdrant_data:
