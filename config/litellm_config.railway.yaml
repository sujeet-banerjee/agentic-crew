# Railway-only LiteLLM configuration.
# Ollama and Langfuse are intentionally excluded from this cloud deployment.
#
# Models are temporarily disabled while diagnosing proxy startup and database
# initialization. Re-enable individual entries after provider secrets are set.
model_list:
  - model_name: gpt4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: groq/openai/gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  - model_name: text-embedding-3-small
    litellm_params:
      model: text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  - model_name: huggingface/all-MiniLM-L6-v2
    litellm_params:
      model: huggingface/sentence-transformers/all-MiniLM-L6-v2
      api_key: os.environ/HUGGINGFACE_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
