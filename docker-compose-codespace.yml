version: '3.8'

services:
  # ---------------------------------------------------------
  # 3. PERSISTENT AGENT MEMORY: Redis with AOF
  # ---------------------------------------------------------
  redis:
    image: redis:latest
    container_name: redis_memory
    # This command turns on Append Only File (AOF) for durability
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_net
    restart: unless-stopped

  # ---------------------------------------------------------
  # 4. THE RELATIONAL STORE: PostgreSQL (pgvector)
  # ---------------------------------------------------------
  postgres:
    # I upgraded this to pgvector instead of vanilla postgres. 
    # It acts as normal Postgres for n8n/metadata, but also allows 
    # you to do SQL-based vector searches if you want to teach it!
    image: pgvector/pgvector:pg15
    container_name: postgres_db
    environment:
      - POSTGRES_USER=ai_user
      - POSTGRES_PASSWORD=ai_password
      - POSTGRES_DB=ai_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_net
    restart: unless-stopped

  # ---------------------------------------------------------
  # 6. MLOps & OBSERVABILITY: LiteLLM Proxy
  # ---------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm_proxy
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HF_API_KEY=${HF_API_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - LANGFUSE_DEBUG=${LANGFUSE_DEBUG}
    # environment:
    #   - DATABASE_URL=postgresql://ai_user:ai_password@postgres:5432/ai_database
    #   - LANGFUSE_SECRET_KEY=sk-lf-df7d66e3-0ae2-41e4-a33e-071d77c2ac44
    #   - LANGFUSE_PUBLIC_KEY=pk-lf-3ca402d4-eec4-4532-9152-d09ebd442b88
    #   - LANGFUSE_OTEL_HOST=http://langfuse-web:3000
    # UNCOMMENT AND UPDATE THESE LINES:
    command: [ "--config", "/app/config.yaml", "--detailed_debug" ]
    volumes:
      - ./config/litellm_config_codespace.yaml:/app/config.yaml
    networks:
      - ai_net
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  qdrant_data:

networks:
  # Putting them all on a custom bridge network allows them to resolve 
  # each other by container_name (e.g., n8n can ping 'redis' directly)
  ai_net:
    driver: bridge